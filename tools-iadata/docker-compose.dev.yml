services:
  pg-dl:
    image: postgres:15-alpine
    container_name: iadata_pg_${DEPLOY_SUFFIX}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_HOST_PORT:-15435}:5432"
    networks:
      - iadata_net

  ia-dl:
    image: qdrant/qdrant:latest
    container_name: iadata_qdrant_${DEPLOY_SUFFIX}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-16333}:6333"
    networks:
      - iadata_net

  back-dl:
    build: 
      context: ./back-dl
      dockerfile: Dockerfile
    image: python:3.11-slim
    container_name: iadata_back_${DEPLOY_SUFFIX}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.dev
    environment:
      - DB_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@pg-dl:5432/${DB_NAME}
      - QDRANT_URL=http://ia-dl:6333
      - ALLOWED_ORIGINS=${allowed_origins}
    volumes:
      - ./back-dl:/app
      - ${DATA_SOURCES_DIR:-./data/sources}:/app/data_sources
      - ${BACKUP_DIR:-./backups}:/backups
    ports:
      - "${BACK_PORT:-18080}:8000"
    depends_on:
      pg-dl:
        condition: service_healthy
      ia-dl:
        condition: service_started
    networks:
      - iadata_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  front-dl:
    build: 
      context: ./front-dl
      dockerfile: Dockerfile
    container_name: iadata_front_${DEPLOY_SUFFIX}
    command: npm run dev
    env_file:
      - .env.dev
    volumes:
      - ./front-dl:/app
      - /app/node_modules
    ports:
      - "${FRONT_PORT:-13000}:3000"
    depends_on:
      - back-dl
    networks:
      - iadata_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pg_data:
    name: ${COMPOSE_PROJECT_NAME}_pg_data
  qdrant_data:
    name: ${COMPOSE_PROJECT_NAME}_qdrant_data

networks:
  iadata_net:
    driver: bridge
