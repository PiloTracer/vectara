services:
  pg-dl:
    image: postgres:15-alpine
    container_name: iadata_pg_${DEPLOY_SUFFIX}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - plpg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_HOST_PORT:-15435}:5432"
    networks:
      - iadata_net

  ia-dl:
    image: qdrant/qdrant:latest
    container_name: iadata_qdrant_${DEPLOY_SUFFIX}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-16333}:6333"
    networks:
      - iadata_net

  llm-dl:
    image: ollama/ollama:latest
    container_name: iadata_llm_${DEPLOY_SUFFIX}
    profiles: ["local-llm"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-21434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s
    networks:
      - iadata_net

  llm-init:
    image: ollama/ollama:latest
    container_name: iadata_llm_init_${DEPLOY_SUFFIX}
    profiles: ["local-llm"]
    depends_on:
      llm-dl:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://llm-dl:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== LLM Pre-Acquisition ==="
        echo "Pulling embedding model: ${LOCAL_EMBEDDING_MODEL_NAME:-bge-m3}..."
        ollama pull ${LOCAL_EMBEDDING_MODEL_NAME:-bge-m3}
        echo "Pulling chat model: ${LOCAL_MODEL_NAME:-qwen2.5:3b}..."
        ollama pull ${LOCAL_MODEL_NAME:-qwen2.5:3b}
        echo "=== All models ready ==="
    networks:
      - iadata_net

  back-dl:
    build: 
      context: ./back-dl
      dockerfile: Dockerfile
    image: python:3.11-slim
    container_name: iadata_back_${DEPLOY_SUFFIX}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.dev
    environment:
      - DB_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@pg-dl:5432/${DB_NAME}
      - QDRANT_URL=http://ia-dl:6333
      - ALLOWED_ORIGINS=${allowed_origins}
    volumes:
      - ./back-dl:/app
      - ${DATA_SOURCES_DIR:-./data/sources}:/app/data_sources
      - ${BACKUP_DIR:-./backups}:/backups
    ports:
      - "${BACK_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    depends_on:
      pg-dl:
        condition: service_healthy
      ia-dl:
        condition: service_started
    networks:
      - iadata_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  front-dl:
    build: 
      context: ./front-dl
      dockerfile: Dockerfile
    container_name: iadata_front_${DEPLOY_SUFFIX}
    command: npm run dev
    env_file:
      - .env.dev
    environment:
      - NEXT_PUBLIC_USE_LOCAL_EMBEDDING=${USE_LOCAL_EMBEDDING}
    volumes:
      - ./front-dl:/app
      - /app/node_modules
    ports:
      - "${FRONT_PORT:-13000}:3000"
    depends_on:
      back-dl:
        condition: service_healthy
    networks:
      - iadata_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  plpg_data:
    name: ${COMPOSE_PROJECT_NAME}_plpg_data
  qdrant_data:
    name: ${COMPOSE_PROJECT_NAME}_qdrant_data
  ollama_data:
    name: ${COMPOSE_PROJECT_NAME}_ollama_data

networks:
  iadata_net:
    driver: bridge
