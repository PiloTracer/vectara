# GPU Override for docker-compose.dev.yml
# Usage: docker compose -f docker-compose.dev.yml -f docker-compose.gpu.yml up
#
# This file ONLY contains overrides for GPU-enabled services.
# The base services are defined in docker-compose.dev.yml (CPU mode).
# When this overlay is applied, GPU acceleration is enabled.

services:
  # Ollama LLM with GPU support
  llm-dl:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Enterprise RAG: Infinity embedding server with GPU acceleration
  infinity:
    command: v2 --model-id BAAI/bge-m3 --batch-size 32 --port 7997 --dtype float16 --device cuda
    environment:
      - HF_HOME=/app/.cache
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Enterprise RAG: Cross-encoder re-ranker with GPU acceleration
  reranker:
    command: v2 --model-id BAAI/bge-reranker-v2-m3 --batch-size 32 --port 7997 --dtype float16 --device cuda
    environment:
      - HF_HOME=/app/.cache
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
